<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>لعبة كمّلها | Kamelha</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
</head>
<body>

  <!-- شريط الإشعارات العلوي -->
  <div id="toast-banner" class="toast hidden"></div>

  <!-- شاشة الدخول والغرف -->
  <div id="lobby-screen" class="screen">
    <div class="lobby-box">
      <h1 class="game-logo">كمّلها</h1>
      <p class="tagline">لعبة الذكاء والسرعة والتحدي</p>

      <div class="input-group">
        <label>اسمك في اللعبة:</label>
        <input type="text" id="player-name" placeholder="اكتب اسمك...">
      </div>

      <button id="btn-create" class="btn primary-btn">إنشاء غرفة جديدة 🎲</button>
      <div class="separator">أو</div>
      <div class="join-group">
        <input type="text" id="room-code-input" placeholder="كود الغرفة">
        <button id="btn-join" class="btn secondary-btn">دخول</button>
      </div>
    </div>
  </div>

  <!-- غرفة الانتظار -->
  <div id="waiting-screen" class="screen hidden">
    <div class="lobby-box">
      <h2>كود الغرفة: <span id="display-room-code" class="code-badge"></span></h2>
      <p class="share-hint">شارك هذا الكود مع أصحابك للدخول</p>
      
      <div class="player-list-box">
        <h3>اللاعبين (<span id="player-count">1</span>/4):</h3>
        <ul id="players-list"></ul>
      </div>

      <button id="btn-start" class="btn primary-btn hidden">ابدأ اللعبة 🎮</button>
      <p id="wait-msg">في انتظار صاحب الغرفة لبدء الجيم...</p>
    </div>
  </div>

  <!-- شاشة اللعب الرئيسية (Responsive Game Board) -->
  <div id="game-screen" class="screen hidden">
    <!-- الشريط العلوي -->
    <header class="game-header">
      <div id="turn-badge" class="badge">دور: <span id="current-player-name">--</span></div>
      <div id="other-players" class="players-row"></div>
    </header>

    <!-- وسط الطاولة -->
    <main class="table-area">
      <!-- كارت السحب -->
      <div class="deck-spot" id="draw-deck">
        <div class="card card-back">
          <span class="logo-txt">كمّلها</span>
          <span id="deck-counter" class="deck-count-num">50</span>
        </div>
        <p>اسحب كارت</p>
      </div>

      <!-- كارت الأرض المكشوف -->
      <div class="deck-spot" id="discard-deck">
        <div id="top-discard-card" class="card-placeholder">لا يوجد</div>
        <p>الأرض المكشوفة</p>
      </div>
    </main>

    <!-- منطقة اللاعب ويده -->
    <footer class="player-zone">
      <div class="zone-header">
        <span>كروتك الحالية:</span>
        <button id="btn-kamelha" class="btn kamelha-btn">كمّلهااا! 👑</button>
      </div>
      <div id="my-hand" class="cards-hand"></div>
    </footer>
  </div>

  <!-- حاوية النوافذ المنبثقة للكوماندز والخيارات -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div id="modal-container" class="modal-card"></div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>

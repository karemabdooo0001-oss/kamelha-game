<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>لوحة تحكم المطور | Wello_0</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
  <style>
    .admin-card {
      background: #1a162b;
      border: 2px solid #ffcc00;
      border-radius: 20px;
      padding: 25px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }
    .current-pass-box {
      background: rgba(255,204,0,0.1);
      border: 1px dashed #ffcc00;
      padding: 12px;
      border-radius: 12px;
      margin: 15px 0;
      font-size: 1.1rem;
    }
  </style>
</head>
<body style="display:flex;justify-content:center;align-items:center;min-height:100vh;">

  <!-- شاشة الدخول السرية لـ Wello -->
  <div id="admin-login" class="admin-card">
    <h1 style="color:#ffcc00;margin-bottom:10px;">👑 لوحة تحكم Wello_0</h1>
    <p style="color:#aaa;font-size:0.9rem;margin-bottom:15px;">أدخل كود الماستر الخاص بك للدخول:</p>
    <input type="password" id="master-key-input" placeholder="كود الماستر السري">
    <button id="btn-admin-login" class="btn primary-btn">دخول للوحة التحكم 🔓</button>
  </div>

  <!-- لوحة إدارة كلمة السر -->
  <div id="admin-panel" class="admin-card hidden">
    <h1 style="color:#ffcc00;margin-bottom:5px;">لوحة تحكم اللعبة ⚙️</h1>
    <p style="color:#aaa;font-size:0.85rem;">تحكم فيمن يمكنه لعب كمّلها</p>

    <div class="current-pass-box">
      الرقم السري الحالي للعبة هو: <br>
      <b id="txt-current-pass" style="color:#ffcc00;font-size:1.8rem;letter-spacing:3px;">--</b>
    </div>

    <div style="text-align:right;margin-bottom:5px;font-size:0.85rem;">اكتب الرقم السري الجديد:</div>
    <input type="text" id="new-pass-input" placeholder="مثلاً: 2025 أو 9988">
    <button id="btn-save-pass" class="btn primary-btn" style="margin-bottom:12px;">حفظ وتغيير الرقم السري فوراً 💾</button>

    <hr style="border-color:#333;margin:15px 0;">

    <button id="btn-copy-vip-link" class="btn secondary-btn">نسخ رابط الدعوة المباشر الجاهز 📋</button>
    <p style="color:#888;font-size:0.75rem;margin-top:6px;">(الرابط ده بيفتح اللعبة علطول بدون ما يطلب منهم كتابة باسوورد)</p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    const adminLoginDiv = document.getElementById('admin-login');
    const adminPanelDiv = document.getElementById('admin-panel');
    const masterKeyInput = document.getElementById('master-key-input');
    const btnAdminLogin = document.getElementById('btn-admin-login');
    const txtCurrentPass = document.getElementById('txt-current-pass');
    const newPassInput = document.getElementById('new-pass-input');
    const btnSavePass = document.getElementById('btn-save-pass');
    const btnCopyVipLink = document.getElementById('btn-copy-vip-link');

    let currentMasterKey = '';
    let activePasscode = '';

    btnAdminLogin.onclick = () => {
      const key = masterKeyInput.value.trim();
      if (!key) return alert('اكتب الكود!');
      socket.emit('adminLogin', key);
    };

    socket.on('adminLoginSuccess', (passcode) => {
      currentMasterKey = masterKeyInput.value.trim();
      activePasscode = passcode;
      txtCurrentPass.innerText = passcode;
      adminLoginDiv.classList.add('hidden');
      adminPanelDiv.classList.remove('hidden');
    });

    socket.on('adminLoginFail', () => alert('كود الماستر غير صحيح!'));

    btnSavePass.onclick = () => {
      const newPass = newPassInput.value.trim();
      if (!newPass) return alert('اكتب باسوورد جديد!');
      socket.emit('adminChangePasscode', { masterKey: currentMasterKey, newPasscode: newPass });
    };

    socket.on('passcodeUpdated', (newPass) => {
      activePasscode = newPass;
      txtCurrentPass.innerText = newPass;
      newPassInput.value = '';
      alert('تم تحديث الرقم السري بنجاح! أي شخص معه القديم تم منعه فوراً.');
    });

    btnCopyVipLink.onclick = () => {
      const fullUrl = window.location.origin + '/?pass=' + encodeURIComponent(activePasscode);
      navigator.clipboard.writeText(fullUrl).then(() => {
        alert('تم نسخ الرابط المباشر! ابعته لأصحابك وهيفتح معاهم علطول.');
      });
    };
  </script>
</body>
</html>
